<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nu</title>
    <link rel="icon" href="nerd_face_color.svg" type="image/svg+xml">
    <style>
        :root {
            /* Single source of truth for the initial and maximum size */
            --container-size: 84vmin;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            height: 100vh;
        }

        svg {
            /* Use the variable so dynamically injected SVGs automatically inherit the size */
            width: var(--container-size);
            height: var(--container-size);
        }

        button,
        input {
            width: 84px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 8px;
        }

        #signature-container {
            width: var(--container-size);
            height: var(--container-size);
            /* Scales the original 4vmin border-radius relative to the 84vmin default size */
            border-radius: calc(var(--container-size) *0.05);
        }

        #input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>

<body>
    <div id="signature-container">
    </div>
    <div id="input-container">
        <button id="themeButton">light</button>
        <button id="modeButton">static</button>
        <input id="durationInput" type="number" min="0" step="100">
        <input id="sizeSlider" type="number" min="12" step="4" title="Adjust Size">
    </div>
    <script>
        let theme = "dark"
        let mode = "animation"
        let svgNk = null
        let svgNu = null
        let timeInterval = null
        let totalDuration = 2002

        const themeButton = document.getElementById('themeButton');
        const modeButton = document.getElementById('modeButton');
        const inputElement = document.getElementById('durationInput');
        const sizeSlider = document.getElementById('sizeSlider');

        function updateSize(value) {
            sizeSlider.value = value;
            document.documentElement.style.setProperty('--container-size', `${sizeSlider.value}vmin`);
        }

        const initialSize = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue('--container-size')
        );
        sizeSlider.max = initialSize;
        updateSize(initialSize);

        sizeSlider.addEventListener('input', (event) => {
            updateSize(event.target.value);
        });

        document.addEventListener('wheel', (event) => {
            if (!event.ctrlKey) return;

            event.preventDefault();

            const min = Number(sizeSlider.min);
            const max = Number(sizeSlider.max);
            const step = Number(sizeSlider.step) || 4;
            const direction = event.deltaY < 0 ? 1 : -1;
            const nextSize = Math.min(max, Math.max(min, sizeSlider.valueAsNumber + direction * step));

            updateSize(nextSize);
        }, { passive: false });

        inputElement.addEventListener('input', (event) => {
            inputDuration = event.target.valueAsNumber;
            if (isNaN(inputDuration)) {
                totalDuration = 0;
            }
            else {
                totalDuration = inputDuration
            }
            resetInterval()
        });

        themeButton.addEventListener('click', function () {
            theme = theme == 'light' ? 'dark' : 'light'
            themeButton.textContent = theme
            setTheme()
        });
        function resetInterval() {
            clearInterval(timeInterval)
            loadAndAnimateSignature()
            timeInterval = setInterval(loadAndAnimateSignature, totalDuration + 1000);
        }
        modeButton.addEventListener('click', function () {
            mode = mode == 'animation' ? 'static' : 'animation'
            modeButton.textContent = mode
            resetInterval()
        });
        async function setTheme() {
            let backgroundColor = theme == "light" ? "#ffffff" : "#000000"
            let pathColor = theme == "light" ? "#000000" : "#ffffff"

            let backgroundElement = document.querySelector('#signature-container')
            let bodyElement = document.querySelector('body')

            backgroundElement.style.backgroundColor = backgroundColor
            bodyElement.style.backgroundColor = pathColor
            const pathList = Array.from(document.querySelectorAll('path'));
            pathList.forEach((path, index) => {
                if (mode == "animation") {
                    path.style.stroke = pathColor
                }
                else {
                    path.style.fill = pathColor
                }
            })
        }
        async function loadAndAnimateSignature() {
            if (svgNk == null || svgNu == null) {
                const responseNk = await fetch('nu-ani.svg');
                const responseNu = await fetch('nu.svg');
                svgNk = await responseNk.text();
                svgNu = await responseNu.text();
            }

            const container = document.getElementById('signature-container');
            container.innerHTML = mode == "animation" ? svgNk : svgNu;
            await setTheme()
            if (mode == 'animation') {
                const layers = Array.from(document.querySelectorAll('g'))
                layers.forEach((layer, index) => {
                    const blockList = Array.from(layer.querySelectorAll('path'));
                    if (index == 0) {
                        tetris1 = animatePath(blockList.slice(0, -14), delayLength = 0)
                        tetris2 = animatePath(blockList.slice(-14, -10), delayLength = 48)
                        tetris3 = animatePath(blockList.slice(-10), delayLength = 72)
                    }
                    else if (index == 1) {
                        signature_line = animatePath(blockList.slice(-1))
                        signature_n = animatePath(blockList.slice(0, 2))
                        signature_k = animatePath(blockList.slice(2, 3))
                        signature_h = animatePath(blockList.slice(3, 4))
                        signature_a = animatePath(blockList.slice(4, -1))
                    }
                    else {
                        name1 = animatePath(blockList.slice(0, 5))
                        name2 = animatePath(blockList.slice(5, 13))
                        name3 = animatePath(blockList.slice(13))
                    }
                })
            }
        }
        function animatePath(paths, delayLength = null) {
            let currentDelay = 0;
            let totalLength = 0
            paths.forEach((path, index) => {
                totalLength += path.getTotalLength()
            })
            paths.forEach((path, index) => {
                let length = path.getTotalLength();
                let duration = delayLength != null ? totalDuration / 96 * length : (length / totalLength) * totalDuration
                // path.style.transition = 'none';
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;
                // path.getBoundingClientRect();

                const animation = path.animate(
                    [
                        { strokeDashoffset: length },
                        { strokeDashoffset: 0 }
                    ],
                    {
                        duration: duration,
                        delay: delayLength != null ? delayLength / 96 * totalDuration : currentDelay,
                        fill: 'forwards',
                        easing: 'ease-in-out'
                    }
                );
                currentDelay += duration;
            });
            return totalLength
        }
        themeButton.click()
        modeButton.click()
        inputElement.value = totalDuration
    </script>
</body>

</html>
